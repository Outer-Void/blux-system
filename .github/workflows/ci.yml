name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (blux-sdk resolved from the pinned Outer-Void/blux commit)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff==0.17.2 mypy==2.4.0 types-PyYAML types-jsonschema build
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest
      - name: Wheel installs and runs outside the source tree
        run: bash scripts/verify_wheel.sh
